<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Monitoring Dashboard</title>
    <meta http-equiv="refresh" content="10">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            margin: 0;
            padding: 30px;
        }
        h1 { color: #60a5fa; }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
        }
        .value { font-size: 32px; color: #34d399; }
        .details { color: #cbd5e1; }
    </style>
</head>
<body>
    <h1>DevOps Monitoring Dashboard</h1>
    <p class="details">System health updates every 10 seconds</p>

    <div class="cards">
        <div class="card">
            <h3>CPU Usage</h3>
            <p class="value">{{ stats.cpu }}%</p>
        </div>
        <div class="card">
            <h3>Memory Usage</h3>
            <p class="value">{{ stats.memory }}%</p>
        </div>
        <div class="card">
            <h3>Disk Usage</h3>
            <p class="value">{{ stats.disk }}%</p>
        </div>
        <div class="card">
            <h3>Operating System</h3>
            <p class="value">{{ stats.system }}</p>
            <p class="details">{{ stats.hostname }}</p>
        </div>
    </div>
</body>
</html>
